name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Auto Generate Android Project Structure
        run: |
          # ساخت خودکار پوشه‌ها و فایل‌های استاندارد اندروید برای جلوگیری از هرگونه خطای ساختاری
          mkdir -p app/src/main/java/com/example/languagelearner
          mkdir -p app/src/main/res/layout

          # ایجاد فایل تنظیمات ریشه
          echo "rootProject.name = 'LanguageLearner'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # ایجاد فایل بیلد ریشه
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          # ایجاد فایل بیلد ماژول app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.languagelearner'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.languagelearner"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # ایجاد فایل AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Language Learner"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ایجاد فایل ظاهر برنامه (XML)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="20dp">
              <TextView
                  android:id="@+id/tvWord"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Apple - سیب"
                  android:textSize="24sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          # ایجاد فایل منطق برنامه (Kotlin)
          cat << 'EOF' > app/src/main/java/com/example/languagelearner/MainActivity.kt
          package com.example.languagelearner
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: language-learner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
